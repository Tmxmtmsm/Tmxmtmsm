<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لعبة سناك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>لعبة سناك</h1>
      <div class="scoreboard">
        <div>النتيجة: <span id="score">0</span></div>
        <div>أفضل نتيجة: <span id="highScore">0</span></div>
      </div>
    </header>

    <main>
      <canvas id="board" width="480" height="480" aria-label="لوحة اللعبة" role="img"></canvas>
      <div class="controls">
        <button id="btnUp" aria-label="أعلى">▲</button>
        <div class="h-row">
          <button id="btnLeft" aria-label="يسار">◀</button>
          <button id="btnPause" aria-label="إيقاف/استئناف">⏯</button>
          <button id="btnRight" aria-label="يمين">▶</button>
        </div>
        <button id="btnDown" aria-label="أسفل">▼</button>
      </div>
    </main>

    <footer>
      <p>التحكم: الأسهم أو WASD أو الأزرار. P للإيقاف/الاستئناف. R لإعادة البدء.</p>
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
